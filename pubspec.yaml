name: bible_garden
description: "Bible Garden: leitura bíblica que faz seu jardim crescer."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  cupertino_ui: ^1.1.6
  drift: ^2.35.4
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.4
  in_app_purchase: ^3.3.1
  intl: ^0.20.3
  material_ui: ^1.11.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  sentry_flutter: ^10.4.0
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  timezone: ^0.11.2

dev_dependencies:
  archive: ^4.7.0
  build_runner: ^2.17.1
  crypto: ^3.0.8
  drift_dev: ^2.35.3
  flame_test: ^2.3.1
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/bible/blivre/
    - assets/arte/animais/
    - assets/arte/plantas/
    - assets/arte/personagens/
    - assets/arte/cenario/
    - assets/arte/itens/
    - assets/arte/efeitos/
    - assets/arte/interface/

hooks:
  user_defines:
    sqlite3:
      # SQLite3MultipleCiphers: o banco inteiro fica cifrado no aparelho.
      source: sqlite3mc
